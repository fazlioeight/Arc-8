# Host Nginx Reverse Proxy Configuration for Arc-8
# Location on EC2: /etc/nginx/conf.d/arc8.conf
#
# Domain -> Container Mapping:
#   - https://arc8-mvp.site (+ www) -> 127.0.0.1:7779 (arc8-frontend-prod)
#   - https://dev.arc8-mvp.site     -> 127.0.0.1:7777 (arc8-frontend / dev)
#   - https://test.arc8-mvp.site    -> 127.0.0.1:7778 (arc8-frontend-testing)
#   - Backend API (/api/*, etc.)    -> 127.0.0.1:8989 (arc8-backend)

# 1. HTTP -> HTTPS Redirect for all environments
server {
    listen 80;
    listen [::]:80;
    server_name arc8-mvp.site www.arc8-mvp.site dev.arc8-mvp.site test.arc8-mvp.site;
    return 301 https://$host$request_uri;
}

# 2. Base / Production Environment (https://arc8-mvp.site, https://www.arc8-mvp.site)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name arc8-mvp.site www.arc8-mvp.site;

    ssl_certificate /etc/letsencrypt/live/arc8-mvp.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arc8-mvp.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 500M;

    location / {
        proxy_pass http://127.0.0.1:7779;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8989;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(overutilization/|member/[^/]+/(costs|risk)$) {
        proxy_pass http://127.0.0.1:8989;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health/ {
        proxy_pass http://127.0.0.1:8989;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

