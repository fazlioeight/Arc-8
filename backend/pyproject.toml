[tool.black]
line-length = 120
target-version = ["py311"]
extend-exclude = '''
/(
    \.venv
  | alembic/versions
)/
'''

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv", "alembic/versions"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line length handled by black/ruff-format
    "B008",  # FastAPI's Depends() pattern is fine
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
"scripts/**" = ["E402"]   # sys.path manipulation before imports is intentional
