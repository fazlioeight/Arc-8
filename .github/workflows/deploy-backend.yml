name: Deploy backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "deploy-to-azure.ps1"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

# Force Node 20 actions (actions/checkout@v4, actions/setup-python@v5,
# azure/login@v2) onto the Node 24 runtime so we don't fail when GitHub
# removes Node 20 from the runner on 2026-09-16. Remove this once the
# action authors publish Node-24-native major versions.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run tests
        env:
          ENVIRONMENT: development
          HIPAA_MODE: "false"
          ALLOW_DUMMY_LOGIN: "true"
          CONTROL_DATABASE_URL: "sqlite+aiosqlite:///./test_control.db"
          DEFAULT_TENANT_DATABASE_URL: "sqlite+aiosqlite:///./test_tenant.db"
        run: pytest tests/ -v --tb=short

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure containerapp extension
        run: az extension add --name containerapp --upgrade --only-show-errors

      # Single canonical deploy path. The script:
      #   - reads existing Key Vault secrets (fails fast on missing under -StrictSecrets)
      #   - runs the migration / Path 2 DDL / tenant provisioning jobs
      #   - builds + pushes the image via ACR
      #   - rolls out a suffixed revision, waits for Healthy, flips traffic
      #   - configures ACA health probes
      # Frontend is deployed by deploy-frontend.yml; we always pass -SkipFrontend.
      - name: Deploy via deploy-to-azure.ps1
        shell: pwsh
        env:
          APP_NAME: ${{ vars.AZURE_CONTAINER_APP }}
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          # Hashtable splat (NOT array splat). Array splat passes elements
          # positionally; hashtable splat binds by name. We need the latter so
          # -AppName / -ResourceGroup don't get bound to the wrong slots.
          $params = @{
            SkipFrontend  = $true
            StrictSecrets = $true
          }
          if ($env:APP_NAME)       { $params.AppName       = $env:APP_NAME }
          if ($env:RESOURCE_GROUP) { $params.ResourceGroup = $env:RESOURCE_GROUP }
          ./deploy-to-azure.ps1 @params

      - name: Smoke test
        env:
          URL: ${{ vars.AZURE_BACKEND_URL }}
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" "$URL/health/live")
          echo "health/live: $status"
          test "$status" = "200"
