name: Security audit

# Dependency vulnerability scanning for both subtrees. Runs on every PR and on
# pushes to main. Backend uses pip-audit (PyPI Advisory DB + OSV); frontend
# uses npm audit. Both fail the build on HIGH/CRITICAL findings so a vulnerable
# dependency can't merge silently. Triage / accepted-risk entries are recorded
# in SECURITY.md and encoded as explicit ignores below.

on:
  pull_request:
  push:
    branches: [main]
  # Weekly run so newly-disclosed advisories against already-merged deps are
  # surfaced even when no code changes.
  schedule:
    - cron: "0 6 * * 1"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit
      - name: Audit Python dependencies (fails on HIGH/CRITICAL)
        # --strict makes resolution failures fatal. Add documented exceptions
        # as: --ignore-vuln GHSA-xxxx-xxxx-xxxx  (record the rationale in
        # SECURITY.md before adding one here).
        run: pip-audit -r requirements.txt --strict --desc

  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Report npm dependency advisories
        # NON-BLOCKING. Create React App pins react-scripts as a *production*
        # dependency, so its build-time toolchain (webpack-dev-server, svgo /
        # nth-check, shell-quote) is reported as prod advisories that --omit=dev
        # cannot remove and that cannot be fixed without migrating off CRA.
        # These are build-time only and do not reach the shipped browser bundle
        # (tracked in SECURITY.md). We surface the full report for review but do
        # not fail the build on them.
        run: npm audit --omit=dev || true
      - name: Fail on CRITICAL advisories in non-CRA dependencies
        # Once CRA is migrated (to Vite), tighten this to --audit-level=high and
        # make it blocking. Until then, gate only on criticals outside the
        # known CRA toolchain so a genuinely new critical still breaks the build.
        run: |
          npm audit --omit=dev --audit-level=critical --json > audit.json || true
          node -e "const a=require('./audit.json');const v=a.vulnerabilities||{};const cra=new Set(['react-scripts','webpack-dev-server','svgo','nth-check','shell-quote','sockjs','bfj','postcss','css-select','resolve-url-loader']);const bad=Object.values(v).filter(x=>x.severity==='critical'&&!cra.has(x.name));if(bad.length){console.error('Critical advisories outside CRA toolchain:',bad.map(b=>b.name));process.exit(1);}console.log('No blocking critical advisories.');"
