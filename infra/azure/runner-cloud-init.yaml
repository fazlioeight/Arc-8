#cloud-config

# Cloud-init payload for a self-hosted GitHub Actions runner VM.
# Used by 06-runner-vm.ps1 via az vm create --custom-data.
#
# Installs the dependencies the deploy-backend.yml workflow needs to run
# inside the VNet:
#   - pwsh (workflow steps declare `shell: pwsh`)
#   - Azure CLI + containerapp extension (deploy-to-azure.ps1)
#   - Docker (kept for local debug; az acr build itself runs server-side)
#   - curl, jq, gh (smoke test, registration script, debugging)
# Stages the actions-runner agent under /opt/actions-runner but DOES NOT
# register it. Registration tokens have a 1-hour TTL, so the registration
# happens out of band via 07-register-runner.ps1 after the VM is reachable.
#
# Output of first-boot setup: /var/log/cloud-init-output.log

package_update: true
package_upgrade: true

packages:
  - apt-transport-https
  - ca-certificates
  - curl
  - gnupg
  - lsb-release
  - jq
  - unzip
  - software-properties-common

users:
  - name: actions-runner
    shell: /bin/bash
    groups: [sudo, docker]
    sudo: ALL=(ALL) NOPASSWD:ALL

write_files:
  - path: /usr/local/bin/install-actions-runner.sh
    permissions: "0755"
    owner: root:root
    content: |
      #!/usr/bin/env bash
      # Downloads, extracts, and installs system dependencies for the latest
      # GitHub Actions runner agent under /opt/actions-runner. Idempotent.
      set -euo pipefail

      RUNNER_HOME=/opt/actions-runner
      mkdir -p "$RUNNER_HOME"
      cd "$RUNNER_HOME"

      if [ ! -f .runner-version ] || [ ! -f config.sh ]; then
        # Discover latest runner release. The tag is "vX.Y.Z"; the tarball
        # uses "X.Y.Z". We curl the GitHub API anonymously -- runner releases
        # are public, so no token needed for this step.
        TAG=$(curl -fsSL https://api.github.com/repos/actions/runner/releases/latest | jq -r .tag_name)
        VERSION="${TAG#v}"
        ARCH=$(dpkg --print-architecture)  # amd64 or arm64
        case "$ARCH" in
          amd64) RUNNER_ARCH=x64 ;;
          arm64) RUNNER_ARCH=arm64 ;;
          *) echo "Unsupported arch: $ARCH" >&2; exit 1 ;;
        esac

        TARBALL="actions-runner-linux-${RUNNER_ARCH}-${VERSION}.tar.gz"
        URL="https://github.com/actions/runner/releases/download/${TAG}/${TARBALL}"
        echo "Downloading $URL"
        curl -fsSL -o "/tmp/${TARBALL}" "$URL"
        tar xzf "/tmp/${TARBALL}" -C "$RUNNER_HOME"
        rm -f "/tmp/${TARBALL}"
        echo "$VERSION" > .runner-version
      fi

      # Runner agent ships an installer for its own native dependencies
      # (libicu, libkrb5, openssl, etc). Idempotent and safe to re-run.
      bash ./bin/installdependencies.sh

      chown -R actions-runner:actions-runner "$RUNNER_HOME"

runcmd:
  # --- Docker (docker.com repo, ce edition) ---------------------------------
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - |
    echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable" > /etc/apt/sources.list.d/docker.list
  # --- PowerShell (Microsoft repo) ------------------------------------------
  - curl -fsSL https://packages.microsoft.com/config/ubuntu/22.04/packages-microsoft-prod.deb -o /tmp/ms.deb
  - dpkg -i /tmp/ms.deb
  - rm -f /tmp/ms.deb
  # --- Azure CLI (Microsoft script-based installer) -------------------------
  - curl -fsSL https://aka.ms/InstallAzureCLIDeb | bash
  # --- GitHub CLI (GitHub repo) ---------------------------------------------
  - curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
  - chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
  - |
    echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" > /etc/apt/sources.list.d/github-cli.list
  # --- Install the package sets --------------------------------------------
  - apt-get update
  - DEBIAN_FRONTEND=noninteractive apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin powershell gh
  - systemctl enable --now docker
  - az extension add --name containerapp --upgrade --only-show-errors || true
  # --- Stage the runner agent (config + service install happen in 07-) -----
  - /usr/local/bin/install-actions-runner.sh
  # --- Sentinel file the registration script polls for ---------------------
  - touch /var/lib/cloud/runner-ready
